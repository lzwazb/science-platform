# 本地开发配置示例
# 复制本文件为 application-local.yml 并填写本机信息；application-local.yml 已被 .gitignore 忽略
spring:
  datasource:
    username: root
    password: 你的数据库密码

app:
  jwt:
    # 签名密钥，至少 32 字节。可用下面的 PowerShell 命令生成：
    #   $b = New-Object byte[] 48
    #   [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b)
    #   [Convert]::ToBase64String($b)
    # 也可以改用环境变量 APP_JWT_SECRET 注入，不写进文件
    secret: 请填写至少32字节的随机字符串
